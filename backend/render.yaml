services:
  - type: web
    name: dognose-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && chmod +x ../scripts/download_models.sh && cd .. && ./scripts/download_models.sh && cd backend
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "dog-photos"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NOSE_MODEL_PATH
        sync: false
      - key: EMBEDDER_MODEL_PATH
        sync: false
      - key: MATCH_THRESHOLD
        value: "0.56"
      - key: MATCH_MARGIN
        value: "0.08"
      - key: USE_FINETUNED
        value: "true"
      - key: ENABLE_CLAHE
        value: "false"
      - key: IDENTIFY_RATE_LIMIT
        value: "10/minute"
      - key: MAX_FILE_SIZE_MB
        value: "10"
